<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#15151A;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;width:1200px}
  h1{font-size:44px;margin:0;padding:44px 0 6px;text-align:center}
  p.sub{font-size:26px;color:#A9A9B5;margin:0 0 24px;text-align:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:36px 30px;padding:10px 60px 50px}
  .card{background:#202028;border-radius:36px;padding:34px 28px 28px;display:flex;flex-direction:column;align-items:center}
  .card.wide{grid-column:1 / span 2}
  .big{width:330px;height:330px;border-radius:74px;display:block}
  .row{display:flex;align-items:center;gap:22px;margin-top:26px}
  .small{width:92px;height:92px;border-radius:21px;display:block}
  .letter{font-size:66px;font-weight:800;line-height:1}
  .name{font-size:28px;color:#D5D5DE;margin-top:4px}
  .txt{display:flex;flex-direction:column}
</style>
<h1>CinematiCam logo options</h1>
<p class="sub">Big = close up · small = size on your home screen</p>
<div class="grid">
  <div class="card"><img class="big" src="A.svg"><div class="row"><img class="small" src="A.svg"><div class="txt"><span class="letter">A</span><span class="name">Lens + record dot</span></div></div></div>
  <div class="card"><img class="big" src="B.svg"><div class="row"><img class="small" src="B.svg"><div class="txt"><span class="letter">B</span><span class="name">Sunset shutter</span></div></div></div>
  <div class="card"><img class="big" src="C.svg"><div class="row"><img class="small" src="C.svg"><div class="txt"><span class="letter">C</span><span class="name">Letter C + record dot</span></div></div></div>
  <div class="card"><img class="big" src="D.svg"><div class="row"><img class="small" src="D.svg"><div class="txt"><span class="letter">D</span><span class="name">Blurred lights</span></div></div></div>
  <div class="card wide"><img class="big" src="E.svg"><div class="row"><img class="small" src="E.svg"><div class="txt"><span class="letter">E</span><span class="name">Record button with pause</span></div></div></div>
</div>
